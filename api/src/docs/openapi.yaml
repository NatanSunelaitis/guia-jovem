openapi: 3.0.3
info:
  title: Guia Jovem API
  description: >
    API REST do Guia Jovem: catálogo de universidades, campus, cursos e
    programas de entrada, financiamento e bolsas de estudo. Contrato completo
    em docs/ESPECIFICACAO.md (seção 5) no repositório.
  version: 0.2.0
  contact:
    name: Guia Jovem
servers:
  - url: /api/v1
    description: API base (versão 1)
tags:
  - name: Aprovação de universidades
    description: RF23 e inativação pelo administrador
  - name: Sistema
    description: Endpoints de infraestrutura da API
  - name: Auth
    description: Login, cadastro de aluno, Google, tokens e recuperação de senha (RF07, RF08, RF09)
  - name: Usuários
    description: Gestão de usuários, alteração de senha e exclusão de conta (RF11)
  - name: Universidades
    description: Catálogo público de universidades, campus e avaliações (RF01, RF02, RF04, RF05, RF06)
  - name: Cursos
    description: Catálogo público de cursos (RF21, RF22)
  - name: Programas
    description: Catálogo público de programas de entrada, financiamento e bolsas (RF12, RF13, RF19)
  - name: Relatorios
    description: Relatório de pesquisa exportável em CSV/PDF (RF03)
  - name: Avaliações
    description: Avaliação de universidade pelo aluno, uma por aluno por universidade (RF02)
  - name: Favoritos
    description: Faculdades salvas do aluno (Figura 25)
  - name: Pesquisas salvas
    description: Pesquisas de universidades salvas pelo aluno para reexecução (classe pesquisaSalva)
  - name: Sugestões
    description: Sugestões enviadas pelo aluno à administração ou a uma universidade (RF08, RF15)
  - name: Notificações
    description: Sino do cabeçalho do usuário logado (RF14)
paths:
  /health:
    get:
      tags: [Sistema]
      summary: Verifica se a API está no ar
      responses:
        '200':
          description: API operacional
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                  meta:
                    type: object

  /auth/register/aluno:
    post:
      tags: [Auth]
      summary: Cria uma conta de aluno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha]
              properties:
                nome: { type: string, maxLength: 100 }
                email: { type: string, format: email, maxLength: 100 }
                senha: { type: string, minLength: 7, description: 'Mínimo de 7 caracteres' }
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokensResposta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflito' }

  /auth/register/universidade:
    post:
      tags: [Auth]
      summary: Cadastra uma universidade em análise (RF20, RF25, fluxo 7.3)
      description: Cria usuário tipo U, universidade com status=P, relaciona os programas informados, cria o primeiro campus (principal) e notifica os administradores (UNIVERSIDADE_PENDENTE).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aceitouTermos, usuario, universidade, campus]
              properties:
                aceitouTermos: { type: boolean, enum: [true] }
                usuario:
                  type: object
                  required: [nome, email, senha]
                  properties:
                    nome: { type: string, maxLength: 100 }
                    email: { type: string, format: email, maxLength: 100 }
                    senha: { type: string, minLength: 7 }
                universidade:
                  type: object
                  required: [razaoSocial, nomeFantasia, cnpj, natureza]
                  properties:
                    razaoSocial: { type: string, maxLength: 100 }
                    nomeFantasia: { type: string, maxLength: 100 }
                    cnpj: { type: string, description: '14 dígitos, com ou sem máscara' }
                    telefonePrincipal: { type: string }
                    linkPagina: { type: string, format: uri }
                    linkSimulados: { type: string, format: uri }
                    natureza: { type: string, enum: [P, V] }
                programasIds: { type: array, items: { type: integer } }
                campus:
                  type: object
                  required: [nome, endereco]
                  properties:
                    nome: { type: string, maxLength: 100 }
                    telefoneCelular: { type: string }
                    telefoneFixo: { type: string }
                    emailCampus: { type: string, format: email }
                    endereco:
                      type: object
                      required: [logradouro, numero, bairro, cidade, estado]
                      properties:
                        logradouro: { type: string, maxLength: 100 }
                        numero: { type: string, maxLength: 10 }
                        complemento: { type: string, maxLength: 100 }
                        bairro: { type: string, maxLength: 100 }
                        cidade: { type: string, maxLength: 100 }
                        estado: { type: string, minLength: 2, maxLength: 2 }
                        cep: { type: string, description: '8 dígitos, com ou sem máscara' }
      responses:
        '201':
          description: Cadastro criado, em análise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokensResposta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflito' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login com e-mail e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, format: email }
                senha: { type: string }
      responses:
        '200':
          description: Login efetuado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokensResposta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/google:
    post:
      tags: [Auth]
      summary: Login ou cadastro de aluno via Google
      description: Universidade não pode ser criada via Google; precisa dos dados institucionais.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
      responses:
        '200':
          description: Login/cadastro efetuado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokensResposta' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotaciona o refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Novo par de tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accessToken: { type: string }
                      refreshToken: { type: string }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoga o refresh token informado
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Sucesso' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Solicita recuperação de senha
      description: Sempre responde 200, mesmo se o e-mail não existir (resposta neutra).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Mensagem neutra de sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      mensagem: { type: string }
                  meta: { type: object }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Redefine a senha a partir do token recebido por e-mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, novaSenha]
              properties:
                token: { type: string }
                novaSenha: { type: string, minLength: 7 }
      responses:
        '200': { $ref: '#/components/responses/Sucesso' }
        '400':
          description: Token inválido/expirado ou dados inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Dados do usuário autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UsuarioResumo' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /usuarios:
    get:
      tags: [Usuários]
      summary: Lista usuários paginados (administrador)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: tipoUsuario
          schema: { type: string, enum: [A, U, D] }
        - in: query
          name: ativo
          description: Situação da conta (Quadro 14)
          schema: { type: string, enum: ['true', 'false'] }
        - in: query
          name: busca
          description: Parte do nome ou do e-mail
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Usuario' }
                  meta: { $ref: '#/components/schemas/Paginacao' }
        '403': { $ref: '#/components/responses/Proibido' }
    post:
      tags: [Usuários]
      summary: Administrador cria um usuário (tipo A ou D)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha, tipoUsuario]
              properties:
                nome: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                senha: { type: string, minLength: 7 }
                tipoUsuario: { type: string, enum: [A, D] }
                cpf: { type: string, minLength: 11, maxLength: 11 }
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Usuario' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Proibido' }
        '409': { $ref: '#/components/responses/Conflito' }

  /usuarios/{id}:
    get:
      tags: [Usuários]
      summary: Detalhe de um usuário (o próprio ou administrador)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Usuario' }
                  meta: { type: object }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    patch:
      tags: [Usuários]
      summary: Atualiza nome/foto (o próprio) ou tipoUsuario/ativo (administrador)
      description: >
        Quadro 14: não é possível inativar nem tirar o perfil D da única conta
        de administrador ativa (409 ULTIMO_ADMINISTRADOR). Grava log_auditoria
        com os dados antes e depois.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string, maxLength: 100 }
                fotoUrl: { type: string, format: uri }
                tipoUsuario: { type: string, enum: [A, D] }
                ativo: { type: boolean }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Usuario' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: ULTIMO_ADMINISTRADOR, é a única conta de administrador ativa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
    delete:
      tags: [Usuários]
      summary: Exclui permanentemente a conta (o próprio ou administrador)
      description: >
        Anonimiza avaliações e sugestões deixadas (id_usuario vira NULL).
        Se for tipo U, a universidade correspondente vai para status=I.
        A única conta de administrador ativa não pode ser excluída, nem por
        ela mesma (409 ULTIMO_ADMINISTRADOR).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmacao: { type: string, example: EXCLUIR }
                senhaAtual: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Sucesso' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: ULTIMO_ADMINISTRADOR, é a única conta de administrador ativa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /usuarios/{id}/senha:
    patch:
      tags: [Usuários]
      summary: Altera a própria senha
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senhaAtual, novaSenha, confirmacao]
              properties:
                senhaAtual: { type: string }
                novaSenha: { type: string, minLength: 7 }
                confirmacao: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Sucesso' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Proibido' }

  /universidades:
    get:
      tags: [Universidades]
      summary: Pesquisa dinâmica de universidades (RF06)
      description: >
        Só retorna universidades com status=A. Pública; o token é opcional. Com
        token de aluno, cada item traz `salva`. Token inválido ou expirado responde 401.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: cidade, schema: { type: string } }
        - { in: query, name: estado, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { in: query, name: natureza, schema: { type: string, enum: [P, V] } }
        - { in: query, name: programaId, schema: { type: integer } }
        - { in: query, name: cursoId, schema: { type: integer } }
        - { in: query, name: areaCurso, schema: { type: string } }
        - { in: query, name: notaMinima, schema: { type: number, minimum: 0, maximum: 5 }, description: 'Extensão do RF06 além do contrato original (ver docs/DECISOES.md): filtra por media_avaliacao >= notaMinima.' }
        - { in: query, name: sort, schema: { type: string, enum: [nome, media, avaliacoes] } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UniversidadeResumo' }
                  meta: { $ref: '#/components/schemas/Paginacao' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /universidades/destaques:
    get:
      tags: [Universidades]
      summary: Carrossel de destaques da home (RF06)
      parameters:
        - { in: query, name: limite, schema: { type: integer, default: 8 } }
      responses:
        '200':
          description: Lista de destaques
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UniversidadeResumo' }
                  meta: { type: object }

  /universidades/administracao:
    get:
      tags: [Aprovação de universidades]
      summary: Lista universidades de qualquer status (administrador, RF23)
      description: >
        Mais antigas primeiro. meta.pendentes conta as universidades com
        status=P, independente dos filtros.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          description: P pendente, A aprovada, R reprovada, I inativa
          schema: { type: string, enum: [P, A, R, I] }
        - in: query
          name: busca
          description: Parte do nome fantasia ou da razão social
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UniversidadeAdmin' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Paginacao'
                      - type: object
                        properties:
                          pendentes: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }

  /universidades/{id}/cadastro:
    get:
      tags: [Aprovação de universidades]
      summary: Dados do cadastro para a análise (administrador ou a própria universidade)
      description: >
        Qualquer status. Traz o motivo da reprovação, o campus principal, os
        programas aceitos e a conta responsável.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
      responses:
        '200':
          description: Cadastro encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UniversidadeCadastro' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /universidades/{id}/aprovar:
    post:
      tags: [Aprovação de universidades]
      summary: Aprova a universidade (P ou R para A)
      description: >
        Grava aprovado_em e aprovado_por e limpa o motivo da reprovação. A
        universidade passa a aparecer na pesquisa pública.
        Grava log_auditoria e a notificação para a conta da universidade na
        mesma transação e envia e-mail; falha no e-mail não desfaz a operação.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
      responses:
        '200':
          description: Status alterado; devolve o cadastro atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UniversidadeCadastro' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: STATUS_INVALIDO, a universidade não está no status de origem desta ação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /universidades/{id}/reprovar:
    post:
      tags: [Aprovação de universidades]
      summary: Reprova a universidade pendente (P para R) com motivo
      description: >
        O motivo fica em motivo_reprovacao e vai na notificação e no e-mail.
        Grava log_auditoria e a notificação para a conta da universidade na
        mesma transação e envia e-mail; falha no e-mail não desfaz a operação.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Status alterado; devolve o cadastro atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UniversidadeCadastro' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: STATUS_INVALIDO, a universidade não está no status de origem desta ação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /universidades/{id}/inativar:
    post:
      tags: [Aprovação de universidades]
      summary: Inativa a universidade aprovada (A para I)
      description: >
        Sai da pesquisa pública, das páginas de detalhe e dos destaques.
        Grava log_auditoria e a notificação para a conta da universidade na
        mesma transação e envia e-mail; falha no e-mail não desfaz a operação.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
      responses:
        '200':
          description: Status alterado; devolve o cadastro atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UniversidadeCadastro' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: STATUS_INVALIDO, a universidade não está no status de origem desta ação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /universidades/{id}/reativar:
    post:
      tags: [Aprovação de universidades]
      summary: Reativa a universidade inativa (I para A)
      description: >
        Só para universidade que já foi aprovada antes (aprovado_em preenchido).
        Grava log_auditoria e a notificação para a conta da universidade na
        mesma transação e envia e-mail; falha no e-mail não desfaz a operação.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
      responses:
        '200':
          description: Status alterado; devolve o cadastro atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UniversidadeCadastro' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: STATUS_INVALIDO, a universidade não está no status de origem desta ação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /universidades/{id}:
    get:
      tags: [Universidades]
      summary: Detalhe da universidade (RF04, RF05)
      description: >
        Registra visita_pagina. Só retorna universidades com status=A. Pública;
        o token é opcional. Com token de aluno, `minhaAvaliacao` traz a
        avaliação dele (ou null). Token inválido ou expirado responde 401.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
      responses:
        '200':
          description: Universidade encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UniversidadeDetalhe' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /universidades/{id}/campus:
    get:
      tags: [Universidades]
      summary: Lista os campus da universidade, com os cursos ofertados em cada um
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
      responses:
        '200':
          description: Lista de campus
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Campus' }
                  meta: { type: object }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /universidades/{id}/cursos:
    get:
      tags: [Universidades]
      summary: Lista os cursos da universidade
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
      responses:
        '200':
          description: Lista de cursos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Curso' }
                  meta: { type: object }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /universidades/{id}/avaliacoes:
    get:
      tags: [Universidades]
      summary: Lista paginada de avaliações da universidade (RF02)
      description: Mostra só o primeiro nome do autor (RNF17/RNF24), da mais recente para a mais antiga.
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada de avaliações
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Avaliacao' }
                  meta: { $ref: '#/components/schemas/Paginacao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Avaliações]
      summary: Aluno avalia a universidade (RF02)
      description: >
        Só perfil aluno e só universidade com status=A. Uma avaliação por aluno
        por universidade: se já existe, responde 409 AVALIACAO_DUPLICADA (editar
        com PUT /avaliacoes/{id}). A data é gravada pelo servidor. Recalcula
        mediaAvaliacao e totalAvaliacoes na mesma transação.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvaliacaoEntrada' }
      responses:
        '201':
          description: Avaliação criada, com a média atualizada da universidade
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AvaliacaoGravada' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /avaliacoes/minhas:
    get:
      tags: [Avaliações]
      summary: Avaliações do aluno logado
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/MinhaAvaliacao'
                        - type: object
                          properties:
                            universidade:
                              type: object
                              properties:
                                id: { type: integer }
                                nomeFantasia: { type: string }
                                logoUrl: { type: string, nullable: true }
                  meta: { $ref: '#/components/schemas/Paginacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }

  /avaliacoes/{id}:
    put:
      tags: [Avaliações]
      summary: Aluno edita a própria avaliação (RF02)
      description: Só o autor. Recalcula a média na mesma transação.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvaliacaoEntrada' }
      responses:
        '200':
          description: Avaliação atualizada, com a média atualizada da universidade
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AvaliacaoGravada' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Avaliações]
      summary: Remove a avaliação (autor ou administrador)
      description: Recalcula a média na mesma transação; sem avaliações, a média volta a null.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Avaliação removida
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sucesso: { type: boolean }
                      universidade: { $ref: '#/components/schemas/MediaUniversidade' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /campus/{id}:
    get:
      tags: [Universidades]
      summary: Detalhe do campus, com endereço e cursos ofertados (RF23, RF24)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Campus encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Campus' }
                  meta: { type: object }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /cursos:
    get:
      tags: [Cursos]
      summary: Pesquisa de cursos (RF21)
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: areaCurso, schema: { type: string } }
        - { in: query, name: modalidade, schema: { type: string } }
        - { in: query, name: grau, schema: { type: string } }
        - { in: query, name: universidadeId, schema: { type: integer } }
        - { in: query, name: cidade, schema: { type: string } }
        - { in: query, name: estado, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Curso' }
                  meta: { $ref: '#/components/schemas/Paginacao' }

  /cursos/destaques:
    get:
      tags: [Cursos]
      summary: Cursos mais ofertados, agrupados por nome (RF21)
      parameters:
        - { in: query, name: limite, schema: { type: integer, default: 8, maximum: 200 } }
        - { in: query, name: q, schema: { type: string }, description: 'Usado por T07 (lista de cursos) para buscar por nome' }
        - { in: query, name: areaCurso, schema: { type: string } }
      responses:
        '200':
          description: Lista de destaques
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        nome: { type: string }
                        areaCurso: { type: string, nullable: true }
                        totalOfertas: { type: integer }
                  meta: { type: object }

  /cursos/nome/{nome}:
    get:
      tags: [Cursos]
      summary: Universidades onde um curso (pelo nome) está disponível
      parameters:
        - in: path
          name: nome
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Universidades encontradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      nome: { type: string }
                      universidades: { type: array, items: { type: object } }
                  meta: { type: object }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /cursos/{id}:
    get:
      tags: [Cursos]
      summary: Detalhe do curso, com os campus onde é ofertado (RF22)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Curso' }
                  meta: { type: object }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /programas:
    get:
      tags: [Programas]
      summary: Pesquisa de programas de entrada, financiamento e bolsas (RF12, RF13, RF19)
      description: |
        Sem `universidadeId`, traz só os programas globais. As bolsas institucionais (programas de uma universidade)
        aparecem apenas filtrando por aquela universidade, que precisa estar aprovada (RF11). Também ficam fora dos destaques.
      parameters:
        - { in: query, name: tipo, schema: { type: string, enum: [ENTRADA, FINANCIAMENTO, BOLSA] } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: universidadeId, schema: { type: integer } }
        - { in: query, name: apenasGlobais, schema: { type: boolean } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Programa' }
                  meta: { $ref: '#/components/schemas/Paginacao' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /programas/destaques:
    get:
      tags: [Programas]
      summary: Carrossel de destaques da home
      description: A home usa tipo=ENTRADA (carrossel de programas de entrada).
      parameters:
        - { in: query, name: limite, schema: { type: integer, default: 8 } }
        - { in: query, name: tipo, schema: { type: string, enum: [ENTRADA, FINANCIAMENTO, BOLSA] } }
      responses:
        '200':
          description: Lista de destaques
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Programa' }
                  meta: { type: object }

  /programas/{id}:
    get:
      tags: [Programas]
      summary: Detalhe do programa, com cronograma e universidades que aceitam
      description: Registra visita_pagina.
      parameters:
        - $ref: '#/components/parameters/ProgramaId'
      responses:
        '200':
          description: Programa encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProgramaDetalhe' }
                  meta: { type: object }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /programas/{id}/universidades:
    get:
      tags: [Programas]
      summary: Universidades que aceitam este programa
      parameters:
        - $ref: '#/components/parameters/ProgramaId'
      responses:
        '200':
          description: Lista de universidades
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object } }
                  meta: { type: object }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /favoritos/universidades:
    get:
      tags: [Favoritos]
      summary: Faculdades salvas do aluno logado
      description: Mesmos dados do card da pesquisa. Universidade que deixou de estar aprovada não aparece.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada, da mais recente para a mais antiga
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/UniversidadeResumo'
                        - type: object
                          properties:
                            salvaEm: { type: string, format: date-time }
                  meta: { $ref: '#/components/schemas/Paginacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
    post:
      tags: [Favoritos]
      summary: Salva uma universidade (idempotente)
      description: 201 quando salva agora; 200 quando já estava salva. Só universidade com status=A.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [universidadeId]
              properties:
                universidadeId: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/FavoritoSalvo' }
        '201': { $ref: '#/components/responses/FavoritoSalvo' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /favoritos/universidades/{id}:
    delete:
      tags: [Favoritos]
      summary: Remove a universidade da lista do aluno (idempotente)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
      responses:
        '200':
          description: Removida (ou já não estava salva)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sucesso: { type: boolean }
                      universidadeId: { type: integer }
                      salva: { type: boolean, enum: [false] }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }

  /pesquisas-salvas:
    get:
      tags: [Pesquisas salvas]
      summary: Pesquisas salvas do aluno logado
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada, da mais recente para a mais antiga
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PesquisaSalva' }
                  meta: { $ref: '#/components/schemas/Paginacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
    post:
      tags: [Pesquisas salvas]
      summary: Salva a pesquisa de universidades atual
      description: >
        `parametros` passa pelo mesmo schema de GET /universidades (sem page e
        pageSize); filtro inválido ou desconhecido responde 400. A data é
        gravada pelo servidor. Nome repetido para o mesmo aluno responde 409
        PESQUISA_DUPLICADA.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string, maxLength: 100 }
                tipo: { type: string, enum: [UNIVERSIDADE], default: UNIVERSIDADE }
                parametros: { $ref: '#/components/schemas/FiltrosPesquisa' }
      responses:
        '201':
          description: Pesquisa salva
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PesquisaSalva' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '409': { $ref: '#/components/responses/Conflito' }

  /pesquisas-salvas/{id}:
    get:
      tags: [Pesquisas salvas]
      summary: Obtém uma pesquisa salva, com os filtros para reexecução
      description: Só o dono; pesquisa de outro aluno responde 403.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Pesquisa salva
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PesquisaSalva' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Pesquisas salvas]
      summary: Exclui uma pesquisa salva
      description: Só o dono; pesquisa de outro aluno responde 403.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Sucesso' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /sugestoes:
    post:
      tags: [Sugestões]
      summary: Aluno envia uma sugestão (RF08)
      description: |
        Sem `universidadeId`, a sugestão vai para a administração e notifica todos os administradores ativos.
        Com `universidadeId` (universidade com status A), notifica a conta que administra a universidade (RF14).
        Nasce com status EM_ANALISE e data do servidor.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, texto]
              properties:
                titulo: { type: string, minLength: 3, maxLength: 100 }
                texto: { type: string, minLength: 10, maxLength: 2000 }
                universidadeId: { type: integer, nullable: true }
      responses:
        '201':
          description: Sugestão criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sugestao' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
    get:
      tags: [Sugestões]
      summary: Sugestões recebidas (RF15)
      description: Administrador vê as sugestões sem universidade; a conta de universidade vê as destinadas à universidade que administra.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [EM_ANALISE, APROVADA, REPROVADA] } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada, mais recentes primeiro
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SugestaoRecebida' }
                  meta: { $ref: '#/components/schemas/Paginacao' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }

  /sugestoes/minhas:
    get:
      tags: [Sugestões]
      summary: Histórico de sugestões do aluno logado (T18)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada, mais recentes primeiro
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Sugestao' }
                  meta: { $ref: '#/components/schemas/Paginacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }

  /sugestoes/{id}:
    get:
      tags: [Sugestões]
      summary: Detalhe de uma sugestão
      description: Só o autor e o destinatário. `podeAvaliar` é true para o destinatário enquanto a sugestão estiver EM_ANALISE.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Sugestão
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SugestaoDetalhe' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /sugestoes/{id}/status:
    patch:
      tags: [Sugestões]
      summary: Destinatário avalia a sugestão (RF15)
      description: Só enquanto EM_ANALISE. Grava a resposta, quem avaliou e a data, e notifica o autor (SUGESTAO_AVALIADA). Uma segunda avaliação responde 409 SUGESTAO_JA_AVALIADA.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, resposta]
              properties:
                status: { type: string, enum: [APROVADA, REPROVADA] }
                resposta: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Sugestão avaliada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SugestaoDetalhe' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /notificacoes:
    get:
      tags: [Notificações]
      summary: Notificações do usuário logado (RF14)
      description: Mais recentes primeiro. `meta.naoLidas` traz o total de não lidas para o contador do sino.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: lida, schema: { type: boolean } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notificacao' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Paginacao'
                      - type: object
                        properties:
                          naoLidas: { type: integer }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /notificacoes/nao-lidas:
    get:
      tags: [Notificações]
      summary: Total de notificações não lidas do usuário logado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Contagem
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      naoLidas: { type: integer }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /notificacoes/{id}/lida:
    patch:
      tags: [Notificações]
      summary: Marca uma notificação como lida
      description: Só a própria; notificação de outro usuário responde 403.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Notificação lida
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Notificacao' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /notificacoes/lidas:
    patch:
      tags: [Notificações]
      summary: Marca todas as notificações do usuário logado como lidas
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Quantidade marcada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      atualizadas: { type: integer }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /relatorios/pesquisa:
    get:
      tags: [Relatorios]
      summary: Relatório de pesquisa exportável (RF03)
      description: Mesmos filtros de GET /universidades. Gera um arquivo com universidades, campus, cursos e programas do resultado (um registro por universidade, com campus/cursos/programas listados nesse registro).
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: cidade, schema: { type: string } }
        - { in: query, name: estado, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { in: query, name: natureza, schema: { type: string, enum: [P, V] } }
        - { in: query, name: programaId, schema: { type: integer } }
        - { in: query, name: cursoId, schema: { type: integer } }
        - { in: query, name: areaCurso, schema: { type: string } }
        - { in: query, name: notaMinima, schema: { type: number, minimum: 0, maximum: 5 } }
        - { in: query, name: sort, schema: { type: string, enum: [nome, media, avaliacoes] } }
        - { in: query, name: formato, required: true, schema: { type: string, enum: [csv, pdf] } }
      responses:
        '200':
          description: Arquivo CSV ou PDF para download
          content:
            text/csv: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UsuarioId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    UniversidadeId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    ProgramaId:
      in: path
      name: id
      required: true
      schema: { type: integer }
  schemas:
    Erro:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items: { type: object }
    Paginacao:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Sugestao:
      type: object
      properties:
        id: { type: integer }
        titulo: { type: string }
        texto: { type: string }
        status: { type: string, enum: [EM_ANALISE, APROVADA, REPROVADA] }
        resposta: { type: string, nullable: true }
        criadoEm: { type: string, format: date-time }
        avaliadoEm: { type: string, format: date-time, nullable: true }
        universidade:
          type: object
          nullable: true
          description: Universidade de destino; null quando foi para a administração.
          properties:
            id: { type: integer }
            nomeFantasia: { type: string }
    SugestaoRecebida:
      allOf:
        - $ref: '#/components/schemas/Sugestao'
        - type: object
          properties:
            autor:
              type: object
              nullable: true
              description: null quando a conta do autor foi excluída.
              properties:
                nome: { type: string }
    SugestaoDetalhe:
      allOf:
        - $ref: '#/components/schemas/SugestaoRecebida'
        - type: object
          properties:
            podeAvaliar: { type: boolean }
    Notificacao:
      type: object
      properties:
        id: { type: integer }
        tipo: { type: string, enum: [NOVA_SUGESTAO, SUGESTAO_AVALIADA, UNIVERSIDADE_PENDENTE, UNIVERSIDADE_APROVADA] }
        titulo: { type: string }
        mensagem: { type: string }
        referenciaTipo: { type: string, nullable: true, description: 'Item a abrir no app: sugestao ou universidade' }
        referenciaId: { type: integer, nullable: true }
        lida: { type: boolean }
        criadoEm: { type: string, format: date-time }
    Usuario:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        email: { type: string }
        tipoUsuario: { type: string, enum: [A, U, D] }
        fotoUrl: { type: string, nullable: true }
        ativo: { type: boolean }
        criadoEm: { type: string, format: date-time }
    UsuarioResumo:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        email: { type: string }
        tipoUsuario: { type: string, enum: [A, U, D] }
        fotoUrl: { type: string, nullable: true }
        universidade:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            status: { type: string, enum: [P, A, R, I] }
    TokensResposta:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
            usuario: { $ref: '#/components/schemas/UsuarioResumo' }
        meta: { type: object }
    UniversidadeResumo:
      type: object
      properties:
        id: { type: integer }
        nomeFantasia: { type: string }
        logoUrl: { type: string, nullable: true }
        natureza: { type: string, enum: [P, V] }
        mediaAvaliacao: { type: number, nullable: true }
        totalAvaliacoes: { type: integer }
        cidade: { type: string, nullable: true }
        estado: { type: string, nullable: true }
        salva: { type: boolean, description: 'Com token de aluno, se ele salvou a universidade; false nos demais casos' }
        programas:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nome: { type: string }
              sigla: { type: string, nullable: true }
              tipo: { type: string, enum: [ENTRADA, FINANCIAMENTO, BOLSA] }
    UniversidadeAdmin:
      type: object
      properties:
        id: { type: integer }
        nomeFantasia: { type: string }
        razaoSocial: { type: string }
        cnpj: { type: string }
        natureza: { type: string, enum: [P, V] }
        status: { type: string, enum: [P, A, R, I] }
        cidade: { type: string, nullable: true }
        estado: { type: string, nullable: true }
        criadoEm: { type: string, format: date-time }
        aprovadoEm: { type: string, format: date-time, nullable: true }
    UniversidadeCadastro:
      type: object
      properties:
        id: { type: integer }
        nomeFantasia: { type: string }
        razaoSocial: { type: string }
        cnpj: { type: string }
        natureza: { type: string, enum: [P, V] }
        descricao: { type: string, nullable: true }
        telefonePrincipal: { type: string, nullable: true }
        linkPagina: { type: string, nullable: true }
        linkSimulados: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        status: { type: string, enum: [P, A, R, I] }
        motivoReprovacao: { type: string, nullable: true }
        aprovadoEm: { type: string, format: date-time, nullable: true }
        criadoEm: { type: string, format: date-time }
        totalCampus: { type: integer }
        campusPrincipal:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nome: { type: string }
            telefoneCelular: { type: string, nullable: true }
            telefoneFixo: { type: string, nullable: true }
            emailCampus: { type: string, nullable: true }
            endereco:
              type: object
              properties:
                logradouro: { type: string }
                numero: { type: string }
                complemento: { type: string, nullable: true }
                bairro: { type: string }
                cidade: { type: string }
                estado: { type: string }
                cep: { type: string }
        programas:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nome: { type: string }
              sigla: { type: string, nullable: true }
              tipo: { type: string, enum: [ENTRADA, FINANCIAMENTO, BOLSA] }
        responsavel:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nome: { type: string }
            email: { type: string }
            ativo: { type: boolean }
    UniversidadeDetalhe:
      type: object
      properties:
        id: { type: integer }
        nomeFantasia: { type: string }
        razaoSocial: { type: string }
        descricao: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        natureza: { type: string, enum: [P, V] }
        linkPagina: { type: string, nullable: true }
        linkSimulados: { type: string, nullable: true }
        mediaAvaliacao: { type: number, nullable: true }
        totalAvaliacoes: { type: integer }
        enderecoPrincipal: { type: object, nullable: true }
        campus: { type: array, items: { type: object } }
        programas:
          type: object
          properties:
            ENTRADA: { type: array, items: { type: object } }
            FINANCIAMENTO: { type: array, items: { type: object } }
            BOLSA: { type: array, items: { type: object } }
        minhaAvaliacao:
          allOf: [{ $ref: '#/components/schemas/MinhaAvaliacao' }]
          nullable: true
          description: Avaliação do aluno logado; null para visitante, outros perfis ou quem ainda não avaliou
        salva: { type: boolean, description: 'Com token de aluno, se ele salvou a universidade; false nos demais casos' }
    Campus:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        telefoneCelular: { type: string, nullable: true }
        telefoneFixo: { type: string, nullable: true }
        emailCampus: { type: string, nullable: true }
        principal: { type: boolean }
        endereco: { type: object }
        cursos: { type: array, items: { type: object } }
    Curso:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        areaCurso: { type: string, nullable: true }
        modalidade: { type: string, nullable: true }
        grau: { type: string, nullable: true }
        duracaoSemestres: { type: integer, nullable: true }
        descricao: { type: string, nullable: true }
        universidade: { type: object }
        campus: { type: array, items: { type: object } }
    Avaliacao:
      type: object
      properties:
        id: { type: integer }
        nota: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: string, nullable: true }
        criadoEm: { type: string, format: date-time }
        autor: { type: string, nullable: true, description: 'Só o primeiro nome; null se a conta foi excluída' }
    AvaliacaoEntrada:
      type: object
      required: [nota]
      properties:
        nota: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: string, maxLength: 500, nullable: true }
    MinhaAvaliacao:
      type: object
      properties:
        id: { type: integer }
        universidadeId: { type: integer }
        nota: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: string, nullable: true }
        criadoEm: { type: string, format: date-time }
    MediaUniversidade:
      type: object
      properties:
        id: { type: integer }
        mediaAvaliacao: { type: number, nullable: true }
        totalAvaliacoes: { type: integer }
    AvaliacaoGravada:
      allOf:
        - $ref: '#/components/schemas/MinhaAvaliacao'
        - type: object
          properties:
            universidade: { $ref: '#/components/schemas/MediaUniversidade' }
    FiltrosPesquisa:
      type: object
      additionalProperties: false
      description: Mesmos filtros de GET /universidades
      properties:
        q: { type: string }
        cidade: { type: string }
        estado: { type: string, minLength: 2, maxLength: 2 }
        natureza: { type: string, enum: [P, V] }
        programaId: { type: integer }
        cursoId: { type: integer }
        areaCurso: { type: string }
        notaMinima: { type: number, minimum: 0, maximum: 5 }
        sort: { type: string, enum: [nome, media, avaliacoes] }
    PesquisaSalva:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        tipo: { type: string, enum: [UNIVERSIDADE] }
        parametros: { $ref: '#/components/schemas/FiltrosPesquisa' }
        criadoEm: { type: string, format: date-time }
    Programa:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        sigla: { type: string, nullable: true }
        tipo: { type: string, enum: [ENTRADA, FINANCIAMENTO, BOLSA] }
        descricao: { type: string }
        imagemUrl: { type: string, nullable: true }
        universidadeId: { type: integer, nullable: true }
    ProgramaDetalhe:
      allOf:
        - $ref: '#/components/schemas/Programa'
        - type: object
          properties:
            requisitos: { type: string, nullable: true }
            comoFunciona: { type: string, nullable: true }
            linkOficial: { type: string, nullable: true }
            eventos: { type: array, items: { type: object } }
            universidades: { type: array, items: { type: object } }
  responses:
    Sucesso:
      description: Operação concluída
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  sucesso: { type: boolean }
              meta: { type: object }
    FavoritoSalvo:
      description: Universidade salva
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  universidadeId: { type: integer }
                  salva: { type: boolean, enum: [true] }
                  salvaEm: { type: string, format: date-time }
              meta: { type: object }
    ValidationError:
      description: Dados inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    NaoAutenticado:
      description: Sem token ou token inválido/expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Proibido:
      description: Sem permissão para este recurso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Conflito:
      description: E-mail, avaliação, nome de pesquisa ou outro identificador já em uso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    RateLimited:
      description: Limite de tentativas excedido (10 req / 15 min por IP)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
