        motivo da reprovação sai da universidade e fica guardado no
        log_auditoria (dados antes), e os administradores ativos recebem a
        notificação UNIVERSIDADE_PENDENTE.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
      responses:
        '200':
          description: Cadastro reenviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UniversidadeCadastro' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: STATUS_INVALIDO, o cadastro não está reprovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /universidades/{id}/avaliacoes:
    get:
      tags: [Universidades]
      summary: Lista paginada de avaliações da universidade (RF01)
      description: Mostra só o primeiro nome do autor (RNF07), da mais recente para a mais antiga.
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada de avaliações
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Avaliacao' }
                  meta: { $ref: '#/components/schemas/Paginacao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Avaliações]
      summary: Aluno avalia a universidade (RF01)
      description: >
        Só perfil aluno e só universidade com status=A. Uma avaliação por aluno
        por universidade: se já existe, responde 409 AVALIACAO_DUPLICADA (editar
        com PUT /avaliacoes/{id}). A data é gravada pelo servidor. Recalcula
        mediaAvaliacao e totalAvaliacoes na mesma transação.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvaliacaoEntrada' }
      responses:
        '201':
          description: Avaliação criada, com a média atualizada da universidade
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AvaliacaoGravada' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /avaliacoes/minhas:
    get:
      tags: [Avaliações]
      summary: Avaliações do aluno logado
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/MinhaAvaliacao'
                        - type: object
                          properties:
                            universidade:
                              type: object
                              properties:
                                id: { type: integer }
                                nomeFantasia: { type: string }
                                logoUrl: { type: string, nullable: true }
                  meta: { $ref: '#/components/schemas/Paginacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }

  /avaliacoes/{id}:
    put:
      tags: [Avaliações]
      summary: Aluno edita a própria avaliação (RF01)
      description: Só o autor. Recalcula a média na mesma transação.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvaliacaoEntrada' }
      responses:
        '200':
          description: Avaliação atualizada, com a média atualizada da universidade
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AvaliacaoGravada' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Avaliações]
      summary: Remove a avaliação (autor ou administrador)
      description: Recalcula a média na mesma transação; sem avaliações, a média volta a null.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Avaliação removida
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sucesso: { type: boolean }
                      universidade: { $ref: '#/components/schemas/MediaUniversidade' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /campus/{id}:
    get:
      tags: [Universidades]
      summary: Detalhe do campus, com endereço e cursos ofertados (RF21, RF22)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Campus encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Campus' }
                  meta: { type: object }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

    patch:
      tags: [Painel da universidade]
      summary: Edita o campus e o endereço (RF21)
      description: >
        Universidade dona (pendente, aprovada ou reprovada) ou administrador.
        principal=true desmarca o anterior; desmarcar o principal sem marcar
        outro responde 409 CAMPUS_PRINCIPAL_OBRIGATORIO.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampusEntrada' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CampusGestao' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/UniversidadeNaoAprovada' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: CAMPUS_PRINCIPAL_OBRIGATORIO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
    delete:
      tags: [Painel da universidade]
      summary: Exclui o campus (lógica, ativo=false)
      description: >
        409 UNICO_CAMPUS para o único campus, CAMPUS_PRINCIPAL para o campus
        principal (marque outro antes) e CAMPUS_COM_OFERTAS enquanto houver
        curso ofertado nele (remova as ofertas antes).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Sucesso' }
