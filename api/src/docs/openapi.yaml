        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: STATUS_INVALIDO, a universidade não está no status de origem desta ação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /universidades/{id}/reativar:
    post:
      tags: [Aprovação de universidades]
      summary: Reativa a universidade inativa (I para A)
      description: >
        Só para universidade que já foi aprovada antes (aprovado_em preenchido).
        Grava log_auditoria e a notificação para a conta da universidade na
        mesma transação e envia e-mail; falha no e-mail não desfaz a operação.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
      responses:
        '200':
          description: Status alterado; devolve o cadastro atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UniversidadeCadastro' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: STATUS_INVALIDO, a universidade não está no status de origem desta ação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /universidades/{id}:
    get:
      tags: [Universidades]
      summary: Detalhe da universidade (RF03)
      description: >
        Registra visita_pagina. Só retorna universidades com status=A. Pública;
        o token é opcional. Com token de aluno, `minhaAvaliacao` traz a
        avaliação dele (ou null). Token inválido ou expirado responde 401.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
      responses:
        '200':
          description: Universidade encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UniversidadeDetalhe' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    patch:
      tags: [Painel da universidade]
      summary: Edita os dados institucionais, incluindo os links da página oficial e de simulados (RF18)
      description: >
        Administrador ou a universidade dona (pendente, aprovada ou reprovada
        corrigindo o cadastro; a inativa recebe 403 UNIVERSIDADE_NAO_APROVADA).
        Na aprovada, a alteração vale na hora, sem nova aprovação. Status tem
        rotas próprias. Grava log_auditoria antes e depois.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UniversidadeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UniversidadeEdicao' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UniversidadeCadastro' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: CNPJ_EM_USO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

