      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Pesquisa salva
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PesquisaSalva' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Pesquisas salvas]
      summary: Exclui uma pesquisa salva
      description: Só o dono; pesquisa de outro aluno responde 403.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Sucesso' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /sugestoes:
    post:
      tags: [Sugestões]
      summary: Aluno envia uma sugestão (RF08)
      description: |
        Sem `universidadeId`, a sugestão vai para a administração e notifica todos os administradores ativos.
        Com `universidadeId` (universidade com status A), notifica a conta que administra a universidade (RF14).
        Nasce com status EM_ANALISE e data do servidor.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, texto]
              properties:
                titulo: { type: string, minLength: 3, maxLength: 100 }
                texto: { type: string, minLength: 10, maxLength: 2000 }
                universidadeId: { type: integer, nullable: true }
      responses:
        '201':
          description: Sugestão criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sugestao' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
    get:
      tags: [Sugestões]
      summary: Sugestões recebidas (RF15)
      description: Administrador vê as sugestões sem universidade; a conta de universidade vê as destinadas à universidade que administra.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [EM_ANALISE, APROVADA, REPROVADA] } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada, mais recentes primeiro
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SugestaoRecebida' }
                  meta: { $ref: '#/components/schemas/Paginacao' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }

  /sugestoes/minhas:
    get:
      tags: [Sugestões]
      summary: Histórico de sugestões do aluno logado (T18)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada, mais recentes primeiro
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Sugestao' }
                  meta: { $ref: '#/components/schemas/Paginacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }

  /sugestoes/{id}:
    get:
      tags: [Sugestões]
      summary: Detalhe de uma sugestão
      description: Só o autor e o destinatário. `podeAvaliar` é true para o destinatário enquanto a sugestão estiver EM_ANALISE.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Sugestão
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SugestaoDetalhe' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /sugestoes/{id}/status:
    patch:
      tags: [Sugestões]
      summary: Destinatário avalia a sugestão (RF15)
      description: Só enquanto EM_ANALISE. Grava a resposta, quem avaliou e a data, e notifica o autor (SUGESTAO_AVALIADA). Uma segunda avaliação responde 409 SUGESTAO_JA_AVALIADA.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, resposta]
              properties:
                status: { type: string, enum: [APROVADA, REPROVADA] }
                resposta: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Sugestão avaliada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SugestaoDetalhe' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
      x-universidade-nao-aprovada: >
        Conta de universidade reprovada ou inativa recebe 403
        UNIVERSIDADE_NAO_APROVADA.

  /estatisticas/resumo:
    get:
      tags: [Dashboard]
      summary: Totais do momento (usuários por perfil, universidades por status, cursos e programas)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EstatisticasResumo' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }

  /estatisticas/visitas:
    get:
      tags: [Dashboard]
      summary: Visitas e logins únicos por dia ou mês no período
      description: >
        Dias (ou meses) sem dados vêm com zero. loginsUnicos é o total de contas
        distintas com LOGIN na auditoria no período inteiro, não a soma da série.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: de
          description: Data inicial (AAAA-MM-DD, Brasília). Padrão, 29 dias antes de ate
          schema: { type: string, format: date }
        - in: query
          name: ate
          description: Data final inclusiva (AAAA-MM-DD, Brasília). Padrão, hoje
          schema: { type: string, format: date }
        - in: query
          name: agrupar
          schema: { type: string, enum: [dia, mes], default: dia }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EstatisticasVisitas' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }

  /estatisticas/ranking:
    get:
      tags: [Dashboard]
      summary: Universidades, programas e cursos mais acessados no período
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: de
          description: Data inicial (AAAA-MM-DD, Brasília). Padrão, 29 dias antes de ate
          schema: { type: string, format: date }
        - in: query
          name: ate
          description: Data final inclusiva (AAAA-MM-DD, Brasília). Padrão, hoje
          schema: { type: string, format: date }
        - in: query
          name: limite
          schema: { type: integer, default: 5, maximum: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EstatisticasRanking' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }

  /notificacoes:
    get:
      tags: [Notificações]
      summary: Notificações do usuário logado (RF14)
      description: Mais recentes primeiro. `meta.naoLidas` traz o total de não lidas para o contador do sino.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: lida, schema: { type: boolean } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notificacao' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Paginacao'
                      - type: object
                        properties:
                          naoLidas: { type: integer }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /notificacoes/nao-lidas:
    get:
      tags: [Notificações]
      summary: Total de notificações não lidas do usuário logado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Contagem
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      naoLidas: { type: integer }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /notificacoes/{id}/lida:
    patch:
      tags: [Notificações]
      summary: Marca uma notificação como lida
      description: Só a própria; notificação de outro usuário responde 403.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Notificação lida
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Notificacao' }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /notificacoes/lidas:
    patch:
      tags: [Notificações]
      summary: Marca todas as notificações do usuário logado como lidas
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Quantidade marcada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      atualizadas: { type: integer }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /relatorios/pesquisa:
    get:
      tags: [Relatórios]
      summary: Relatório de pesquisa exportável (RF02)
      description: Mesmos filtros de GET /universidades. Gera um arquivo com universidades, campus, cursos e programas do resultado (um registro por universidade, com campus/cursos/programas listados nesse registro).
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: cidade, schema: { type: string } }
        - { in: query, name: estado, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { in: query, name: natureza, schema: { type: string, enum: [P, V] } }
        - { in: query, name: programaId, schema: { type: integer } }
        - { in: query, name: cursoId, schema: { type: integer } }
        - { in: query, name: areaCurso, schema: { type: string } }
        - { in: query, name: notaMinima, schema: { type: number, minimum: 0, maximum: 5 } }
        - { in: query, name: sort, schema: { type: string, enum: [nome, media, avaliacoes] } }
        - { in: query, name: formato, required: true, schema: { type: string, enum: [csv, pdf] } }
      responses:
        '200':
          description: Arquivo CSV ou PDF para download
          content:
            text/csv: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UsuarioId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    UniversidadeId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    ProgramaId:
      in: path
      name: id
      required: true
      schema: { type: integer }
  schemas:
    EnderecoCampus:
      type: object
      properties:
        logradouro: { type: string }
        numero: { type: string }
        complemento: { type: string, nullable: true }
        bairro: { type: string }
        cidade: { type: string }
        estado: { type: string, example: SP }
        cep: { type: string, example: '13309640' }
    CampusEntrada:
      type: object
      required: [nome, endereco]
      properties:
        nome: { type: string, maxLength: 100 }
        cnpj: { type: string, nullable: true, description: 'Opcional; 14 caracteres (aceita o CNPJ alfanumérico), pontuação removida' }
        telefoneCelular: { type: string, nullable: true }
        telefoneFixo: { type: string, nullable: true }
        emailCampus: { type: string, format: email, nullable: true }
        principal: { type: boolean, description: 'true desmarca o principal anterior; o primeiro campus é sempre o principal' }
        endereco:
          allOf:
            - $ref: '#/components/schemas/EnderecoCampus'
          description: CEP obrigatório (8 dígitos) no cadastro; na edição, os campos são parciais
    CampusGestao:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        cnpj: { type: string, nullable: true }
        telefoneCelular: { type: string, nullable: true }
        telefoneFixo: { type: string, nullable: true }
        emailCampus: { type: string, nullable: true }
        principal: { type: boolean }
        endereco: { $ref: '#/components/schemas/EnderecoCampus' }
        totalOfertas: { type: integer }
    OfertaEntrada:
      type: object
      required: [campusId, turno]
      properties:
        campusId: { type: integer }
        turno: { type: string, enum: [Matutino, Vespertino, Noturno, Integral] }
        vagas: { type: integer, nullable: true, minimum: 0 }
    Oferta:
      type: object
      properties:
        cursoId: { type: integer }
        campusId: { type: integer }
        campusNome: { type: string }
        turno: { type: string }
        vagas: { type: integer, nullable: true }
    CursoGestao:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        areaCurso: { type: string, nullable: true }
        notaMec: { type: string, nullable: true }
        modalidade: { type: string, nullable: true }
        grau: { type: string, nullable: true }
        duracaoSemestres: { type: integer, nullable: true }
        descricao: { type: string, nullable: true }
        ofertas:
          type: array
          items: { $ref: '#/components/schemas/Oferta' }
    ProgramaAceito:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        sigla: { type: string, nullable: true }
        tipo: { type: string, enum: [ENTRADA, FINANCIAMENTO, BOLSA] }
        aceito: { type: boolean }
        observacao: { type: string, nullable: true }
    ProgramasAceitosEntrada:
      type: object
      required: [programas]
      properties:
        programas:
          type: array
          description: Conjunto completo; programas fora da lista deixam de ser aceitos
          items:
            type: object
            required: [programaId]
            properties:
              programaId: { type: integer }
              observacao: { type: string, nullable: true, maxLength: 255 }
    BolsaEntrada:
      type: object
      required: [nome, descricao]
      properties:
        nome: { type: string, maxLength: 100 }
        sigla: { type: string, nullable: true }
        descricao: { type: string }
        requisitos: { type: string, nullable: true }
        comoFunciona: { type: string, nullable: true }
        linkOficial: { type: string, nullable: true }
        imagemUrl: { type: string, nullable: true }
    BolsaInstitucional:
      allOf:
        - $ref: '#/components/schemas/BolsaEntrada'
        - type: object
          properties:
            id: { type: integer }
            tipo: { type: string, enum: [BOLSA] }
            criadoEm: { type: string, format: date-time }
    EstatisticaUniversidade:
      type: object
      properties:
        de: { type: string, format: date }
        ate: { type: string, format: date }
        visitas: { type: integer }
        mediaAvaliacao: { type: number, nullable: true }
        totalAvaliacoes: { type: integer }
    Erro:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items: { type: object }
    Paginacao:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Sugestao:
      type: object
      properties:
        id: { type: integer }
        titulo: { type: string }
        texto: { type: string }
        status: { type: string, enum: [EM_ANALISE, APROVADA, REPROVADA] }
        resposta: { type: string, nullable: true }
        criadoEm: { type: string, format: date-time }
        avaliadoEm: { type: string, format: date-time, nullable: true }
        universidade:
          type: object
          nullable: true
          description: Universidade de destino; null quando foi para a administração.
          properties:
            id: { type: integer }
            nomeFantasia: { type: string }
    SugestaoRecebida:
      allOf:
        - $ref: '#/components/schemas/Sugestao'
        - type: object
          properties:
            autor:
              type: object
              nullable: true
              description: null quando a conta do autor foi excluída.
              properties:
                nome: { type: string }
    SugestaoDetalhe:
      allOf:
        - $ref: '#/components/schemas/SugestaoRecebida'
        - type: object
          properties:
            podeAvaliar: { type: boolean }
    Notificacao:
      type: object
      properties:
        id: { type: integer }
        tipo: { type: string, enum: [NOVA_SUGESTAO, SUGESTAO_AVALIADA, UNIVERSIDADE_PENDENTE, UNIVERSIDADE_APROVADA] }
        titulo: { type: string }
        mensagem: { type: string }
        referenciaTipo: { type: string, nullable: true, description: 'Item a abrir no app: sugestao ou universidade' }
        referenciaId: { type: integer, nullable: true }
        lida: { type: boolean }
        criadoEm: { type: string, format: date-time }
    Usuario:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        email: { type: string }
        tipoUsuario: { type: string, enum: [A, U, D] }
        fotoUrl: { type: string, nullable: true }
        ativo: { type: boolean }
        criadoEm: { type: string, format: date-time }
    UsuarioResumo:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        email: { type: string }
        tipoUsuario: { type: string, enum: [A, U, D] }
        fotoUrl: { type: string, nullable: true }
        universidade:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            status: { type: string, enum: [P, A, R, I] }
    TokensResposta:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
            usuario: { $ref: '#/components/schemas/UsuarioResumo' }
        meta: { type: object }
    UniversidadeResumo:
      type: object
      properties:
        id: { type: integer }
        nomeFantasia: { type: string }
        logoUrl: { type: string, nullable: true }
        natureza: { type: string, enum: [P, V] }
        mediaAvaliacao: { type: number, nullable: true }
        totalAvaliacoes: { type: integer }
        cidade: { type: string, nullable: true }
        estado: { type: string, nullable: true }
        salva: { type: boolean, description: 'Com token de aluno, se ele salvou a universidade; false nos demais casos' }
        programas:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nome: { type: string }
              sigla: { type: string, nullable: true }
              tipo: { type: string, enum: [ENTRADA, FINANCIAMENTO, BOLSA] }
    UniversidadeAdmin:
      type: object
      properties:
        id: { type: integer }
        nomeFantasia: { type: string }
        razaoSocial: { type: string }
        cnpj: { type: string }
        natureza: { type: string, enum: [P, V] }
        status: { type: string, enum: [P, A, R, I] }
        cidade: { type: string, nullable: true }
        estado: { type: string, nullable: true }
        criadoEm: { type: string, format: date-time }
        aprovadoEm: { type: string, format: date-time, nullable: true }
    UniversidadeCadastro:
      type: object
      properties:
        id: { type: integer }
        nomeFantasia: { type: string }
        razaoSocial: { type: string }
        cnpj: { type: string }
        natureza: { type: string, enum: [P, V] }
        descricao: { type: string, nullable: true }
        telefonePrincipal: { type: string, nullable: true }
        linkPagina: { type: string, nullable: true }
        linkSimulados: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        status: { type: string, enum: [P, A, R, I] }
        motivoReprovacao: { type: string, nullable: true }
        aprovadoEm: { type: string, format: date-time, nullable: true }
        criadoEm: { type: string, format: date-time }
        totalCampus: { type: integer }
        campusPrincipal:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nome: { type: string }
            telefoneCelular: { type: string, nullable: true }
            telefoneFixo: { type: string, nullable: true }
            emailCampus: { type: string, nullable: true }
            endereco:
              type: object
              properties:
                logradouro: { type: string }
                numero: { type: string }
                complemento: { type: string, nullable: true }
                bairro: { type: string }
                cidade: { type: string }
                estado: { type: string }
                cep: { type: string }
        programas:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nome: { type: string }
              sigla: { type: string, nullable: true }
              tipo: { type: string, enum: [ENTRADA, FINANCIAMENTO, BOLSA] }
        responsavel:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nome: { type: string }
            email: { type: string }
            ativo: { type: boolean }
    UniversidadeDetalhe:
      type: object
      properties:
        id: { type: integer }
        nomeFantasia: { type: string }
        razaoSocial: { type: string }
        descricao: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        natureza: { type: string, enum: [P, V] }
        linkPagina: { type: string, nullable: true }
        linkSimulados: { type: string, nullable: true }
        mediaAvaliacao: { type: number, nullable: true }
        totalAvaliacoes: { type: integer }
        enderecoPrincipal: { type: object, nullable: true }
        campus: { type: array, items: { type: object } }
        programas:
          type: object
          properties:
            ENTRADA: { type: array, items: { type: object } }
            FINANCIAMENTO: { type: array, items: { type: object } }
            BOLSA: { type: array, items: { type: object } }
        minhaAvaliacao:
          allOf: [{ $ref: '#/components/schemas/MinhaAvaliacao' }]
          nullable: true
          description: Avaliação do aluno logado; null para visitante, outros perfis ou quem ainda não avaliou
        salva: { type: boolean, description: 'Com token de aluno, se ele salvou a universidade; false nos demais casos' }
    Campus:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        telefoneCelular: { type: string, nullable: true }
        telefoneFixo: { type: string, nullable: true }
        emailCampus: { type: string, nullable: true }
        principal: { type: boolean }
        endereco: { type: object }
        cursos: { type: array, items: { type: object } }
    Curso:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        areaCurso: { type: string, nullable: true }
        modalidade: { type: string, nullable: true }
        grau: { type: string, nullable: true }
        duracaoSemestres: { type: integer, nullable: true }
        descricao: { type: string, nullable: true }
        universidade: { type: object }
        campus: { type: array, items: { type: object } }
    Avaliacao:
      type: object
      properties:
        id: { type: integer }
        nota: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: string, nullable: true }
        criadoEm: { type: string, format: date-time }
        autor: { type: string, nullable: true, description: 'Só o primeiro nome; null se a conta foi excluída' }
    AvaliacaoEntrada:
      type: object
      required: [nota]
      properties:
        nota: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: string, maxLength: 500, nullable: true }
    MinhaAvaliacao:
      type: object
      properties:
        id: { type: integer }
        universidadeId: { type: integer }
        nota: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: string, nullable: true }
        criadoEm: { type: string, format: date-time }
    MediaUniversidade:
      type: object
      properties:
        id: { type: integer }
        mediaAvaliacao: { type: number, nullable: true }
        totalAvaliacoes: { type: integer }
    AvaliacaoGravada:
      allOf:
        - $ref: '#/components/schemas/MinhaAvaliacao'
        - type: object
          properties:
            universidade: { $ref: '#/components/schemas/MediaUniversidade' }
    FiltrosPesquisa:
      type: object
      additionalProperties: false
      description: Mesmos filtros de GET /universidades
      properties:
        q: { type: string }
        cidade: { type: string }
        estado: { type: string, minLength: 2, maxLength: 2 }
        natureza: { type: string, enum: [P, V] }
        programaId: { type: integer }
        cursoId: { type: integer }
        areaCurso: { type: string }
        notaMinima: { type: number, minimum: 0, maximum: 5 }
        sort: { type: string, enum: [nome, media, avaliacoes] }
    PesquisaSalva:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        tipo: { type: string, enum: [UNIVERSIDADE] }
        parametros: { $ref: '#/components/schemas/FiltrosPesquisa' }
        criadoEm: { type: string, format: date-time }
    Programa:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        sigla: { type: string, nullable: true }
        tipo: { type: string, enum: [ENTRADA, FINANCIAMENTO, BOLSA] }
        descricao: { type: string }
        imagemUrl: { type: string, nullable: true }
        universidadeId: { type: integer, nullable: true }
    EstatisticasResumo:
      type: object
      properties:
        usuariosPorPerfil:
          type: object
          properties: { A: { type: integer }, U: { type: integer }, D: { type: integer }, total: { type: integer } }
        universidadesPorStatus:
          type: object
          properties:
            P: { type: integer }
            A: { type: integer }
            R: { type: integer }
            I: { type: integer }
            total: { type: integer }
        cursos: { type: integer }
        programasPorTipo:
          type: object
          properties:
            ENTRADA: { type: integer }
            FINANCIAMENTO: { type: integer }
            BOLSA: { type: integer }
            total: { type: integer }
    EstatisticasVisitas:
      type: object
      properties:
        de: { type: string, format: date }
        ate: { type: string, format: date }
        agrupar: { type: string, enum: [dia, mes] }
        totalVisitas: { type: integer }
        loginsUnicos: { type: integer }
        visitasPorPerfil:
          type: object
          properties:
            visitante: { type: integer }
            A: { type: integer }
            U: { type: integer }
            D: { type: integer }
        serie:
          type: array
          items:
            type: object
            properties:
              periodo: { type: string, example: '2026-11-17' }
              visitas: { type: integer }
              loginsUnicos: { type: integer }
    EstatisticasRanking:
      type: object
      properties:
        de: { type: string, format: date }
        ate: { type: string, format: date }
        universidades: { type: array, items: { $ref: '#/components/schemas/ItemRanking' } }
        programas: { type: array, items: { $ref: '#/components/schemas/ItemRanking' } }
        cursos: { type: array, items: { $ref: '#/components/schemas/ItemRanking' } }
    ItemRanking:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        visitas: { type: integer }
    UniversidadeEdicao:
      type: object
      description: Todos opcionais; texto vazio limpa o campo.
      properties:
        nomeFantasia: { type: string, maxLength: 100 }
        razaoSocial: { type: string, maxLength: 100 }
        cnpj: { type: string, description: 14 dígitos; pontuação é removida }
        natureza: { type: string, enum: [P, V] }
        descricao: { type: string, nullable: true }
        telefonePrincipal: { type: string, nullable: true }
        linkPagina: { type: string, nullable: true }
        linkSimulados: { type: string, nullable: true }
    CursoEntrada:
      type: object
      required: [nome]
      properties:
        nome: { type: string, maxLength: 100 }
        areaCurso: { type: string, nullable: true }
        notaMec: { type: string, nullable: true }
        modalidade: { type: string, nullable: true }
        grau: { type: string, nullable: true }
        duracaoSemestres: { type: integer, minimum: 1, maximum: 20, nullable: true }
        descricao: { type: string, nullable: true }
    CursoAdmin:
      allOf:
        - $ref: '#/components/schemas/CursoEntrada'
        - type: object
          properties:
            id: { type: integer }
            universidade: { type: object, properties: { id: { type: integer }, nomeFantasia: { type: string } } }
            totalCampus: { type: integer, description: Campus onde o curso é ofertado }
    ProgramaEntrada:
      type: object
      required: [nome, tipo, descricao]
      properties:
        nome: { type: string, maxLength: 100 }
        sigla: { type: string, nullable: true }
        tipo: { type: string, enum: [ENTRADA, FINANCIAMENTO, BOLSA] }
        descricao: { type: string }
        requisitos: { type: string, nullable: true }
        comoFunciona: { type: string, nullable: true }
        linkOficial: { type: string, nullable: true, description: URL com http:// ou https:// }
        imagemUrl: { type: string, nullable: true, description: URL com http:// ou https:// }
    ProgramaAdmin:
      allOf:
        - $ref: '#/components/schemas/ProgramaEntrada'
        - type: object
          properties:
            id: { type: integer }
            criadoEm: { type: string, format: date-time }
            totalUniversidades: { type: integer, description: Universidades que aceitam o programa }
            eventos: { type: array, items: { $ref: '#/components/schemas/EventoPrograma' } }
    EventoEntrada:
      type: object
      required: [titulo, dataInicio]
      properties:
        titulo: { type: string, maxLength: 100 }
        descricao: { type: string, maxLength: 255, nullable: true }
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date, nullable: true, description: Igual ou depois de dataInicio }
    EventoPrograma:
      allOf:
        - $ref: '#/components/schemas/EventoEntrada'
        - type: object
          properties:
            id: { type: integer }
    ProgramaDetalhe:
      allOf:
        - $ref: '#/components/schemas/Programa'
        - type: object
          properties:
            requisitos: { type: string, nullable: true }
            comoFunciona: { type: string, nullable: true }
            linkOficial: { type: string, nullable: true }
            eventos: { type: array, items: { type: object } }
            universidades: { type: array, items: { type: object } }
            universidade:
              type: object
              nullable: true
              description: Universidade dona da bolsa institucional; nulo nos programas globais.
              properties:
                id: { type: integer }
                nomeFantasia: { type: string }
                logoUrl: { type: string, nullable: true }
  responses:
    Sucesso:
      description: Operação concluída
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  sucesso: { type: boolean }
              meta: { type: object }
    FavoritoSalvo:
      description: Universidade salva
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  universidadeId: { type: integer }
                  salva: { type: boolean, enum: [true] }
                  salvaEm: { type: string, format: date-time }
              meta: { type: object }
    ValidationError:
      description: Dados inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    NaoAutenticado:
      # Também quando a conta do token foi inativada ou excluída (message "Conta inativa ou excluída").
      description: Sem token ou token inválido/expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    UniversidadeNaoAprovada:
      description: >
        FORBIDDEN (outra universidade ou perfil errado) ou
        UNIVERSIDADE_NAO_APROVADA: a reprovada só corrige a instituição e os
        campi, e a inativa só lê
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Proibido:
      description: Sem permissão para este recurso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Conflito:
      description: E-mail, avaliação, nome de pesquisa ou outro identificador já em uso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    RateLimited:
      description: Limite de tentativas excedido (10 req / 15 min por IP)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
