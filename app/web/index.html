<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Guia Jovem: seu guia completo para financiamento estudantil, ingresso universitário e bolsas de estudo.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Guia Jovem">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon: SVG nos navegadores que aceitam, PNG nos demais. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Guia Jovem</title>
  <link rel="manifest" href="manifest.json">

  <!-- Tela de carregamento: o logo animado em fundo branco até o primeiro quadro do Flutter. -->
  <style>
    #carregando {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      transition: opacity 0.3s ease-out;
    }
    #carregando img {
      width: min(240px, 50vw);
      height: auto;
    }
    #carregando.saindo {
      opacity: 0;
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="carregando" role="progressbar" aria-label="Carregando o Guia Jovem">
    <img src="guia-jovem-loading-loop.svg" alt="Guia Jovem">
  </div>
  <script>
    // O conversor de teclado do Flutter 3.13 (web) lança uma exceção nas
    // teclas / * - + do teclado numérico (location 3). Esses eventos não
    // seguem para o Flutter; o caractere continua chegando ao campo pelo
    // evento de digitação do navegador. Pode sair ao atualizar o Flutter.
    ['keydown', 'keyup'].forEach(function(tipo) {
      window.addEventListener(tipo, function(evento) {
        if (evento.location === 3 && '/*-+'.indexOf(evento.key) !== -1) {
          evento.stopImmediatePropagation();
        }
      }, true);
    });

    // Remove a tela de carregamento quando o app desenha o primeiro quadro.
    window.addEventListener('flutter-first-frame', function() {
      var carregando = document.getElementById('carregando');
      if (!carregando) return;
      carregando.classList.add('saindo');
      setTimeout(function() { carregando.remove(); }, 300);
    }, { once: true });

    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
