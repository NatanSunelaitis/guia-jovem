name: app
description: Guia Jovem, aplicativo Flutter (web principal, Android/iOS como bônus).
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  google_fonts: 4.0.5
  material_symbols_icons: ^4.2960.0
  go_router: ^13.2.0
  flutter_svg: ^2.0.10+1
  http: ^1.1.0
  url_launcher: ^6.2.4
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/img/logos/
    - assets/img/programas/
    - assets/img/areas/
    - assets/fotos/cursos/
    - assets/fotos/programas/
