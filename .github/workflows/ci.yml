name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: guiajovem
          MYSQL_DATABASE: guiajovem
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pguiajovem"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:guiajovem@127.0.0.1:3306/guiajovem
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ADMIN_NOME: Administrador Guia Jovem
      ADMIN_EMAIL: admin@guiajovem.com.br
      ADMIN_SENHA: senha-de-ci-123456
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Testes
        run: npm test

      - name: Rodar seed
        run: node prisma/seed.js

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9'
          channel: 'stable'

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código
        run: flutter analyze

      - name: Testes
        run: flutter test
