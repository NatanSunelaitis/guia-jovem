name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # sql_mode padrão da imagem mysql:8.0 inclui STRICT_TRANS_TABLES (entre
      # outros), igual ao MySQL 8 local usado para validar a migration; não
      # sobrescrever. TZ=UTC para bater com a regra "datas em ISO 8601 UTC"
      # da seção 3.5 da especificação.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: guiajovem
          MYSQL_DATABASE: guiajovem
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pguiajovem"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:guiajovem@127.0.0.1:3306/guiajovem
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ADMIN_NOME: Administrador Guia Jovem
      ADMIN_EMAIL: admin@guiajovem.com.br
      ADMIN_SENHA: senha-de-ci-123456
      # estatisticas.banco.test.js confere os números do dashboard no MySQL do
      # job (migrations aplicadas antes dos testes), numa transação desfeita.
      TESTE_BANCO_REAL: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Testes
        run: npm test

      - name: Rodar seed
        run: node prisma/seed.js

      # Sobe a API contra um banco próprio no mesmo MySQL (recriado a cada
      # execução) e percorre os fluxos dos três perfis pela HTTP.
      - name: Conferência de ponta a ponta
        run: npm run conferencia
        env:
          CONFERENCIA_DATABASE_URL: mysql://root:guiajovem@127.0.0.1:3306/guiajovem_e2e

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9'
          channel: 'stable'

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código
        run: flutter analyze

      - name: Testes
        run: flutter test
